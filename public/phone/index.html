<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080d" />
    <title>Camera · Internet Café</title>
    <link rel="stylesheet" href="./phone.css" />
  </head>
  <body>
    <canvas id="output" aria-label="Processed camera output"></canvas>
    <video id="webrtc-output" autoplay playsinline muted aria-label="Processed camera output"></video>

    <section id="live-ui" class="live-ui" aria-label="Live comments">
      <div class="live-chrome" aria-hidden="true">
        <span class="live-badge"><i></i> Live</span>
        <span id="filter-state" class="filter-state" hidden></span>
      </div>
      <div class="live-comment-shade" aria-hidden="true"></div>
      <div id="live-comment-feed" class="live-comment-feed" aria-live="polite" aria-relevant="additions"></div>
    </section>

    <button id="previous-filter" class="filter-step filter-step--previous" type="button" aria-label="Previous filter">
      <span aria-hidden="true">&#8249;</span>
    </button>
    <button id="next-filter" class="filter-step filter-step--next" type="button" aria-label="Next filter">
      <span aria-hidden="true">&#8250;</span>
    </button>

    <template id="live-comment-template">
      <article class="live-comment">
        <div data-comment-avatar class="live-comment-avatar" aria-hidden="true"></div>
        <p><strong data-comment-sender></strong> <span data-comment-message></span></p>
      </article>
    </template>

    <section id="notification-region" class="notification-region" aria-live="assertive"></section>
    <template id="notification-template">
      <article class="phone-notification" aria-label="Notification">
        <div data-notification-icon class="notification-icon notification-icon--instagram" aria-hidden="true">◎</div>
        <div class="notification-content">
          <div class="notification-meta">
            <b data-notification-app>Instagram</b>
            <time>now</time>
          </div>
          <strong data-notification-sender></strong>
          <p data-notification-message></p>
        </div>
      </article>
    </template>

    <aside id="fps-overlay" class="hud" aria-live="polite">
      <div class="title-row">
        <span>Internet Café</span>
        <span id="seat">Seat 1</span>
      </div>
      <div id="connection-status" class="status status--waiting">Connecting…</div>
      <div class="metrics">
        <span>↑ <b id="uplink-fps">0</b> fps</span>
        <span>↓ <b id="downlink-fps">0</b> fps</span>
      </div>
    </aside>

    <section id="start-panel" class="start-panel">
      <p id="camera-message">Allow camera access to join the stream.</p>
      <button id="start-camera" type="button">Start Camera</button>
    </section>

    <!-- The camera is an input only; processed frames are rendered above. -->
    <video id="camera" muted playsinline aria-hidden="true"></video>
    <script type="module" src="./phone.js"></script>
  </body>
</html>
