<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080d" />
    <title>Camera · Internet Café</title>
    <link rel="stylesheet" href="./phone.css" />
  </head>
  <body>
    <canvas id="output" aria-label="Processed camera output"></canvas>

    <section id="notification-region" class="notification-region" aria-live="assertive" hidden>
      <article id="phone-notification" class="phone-notification" aria-label="Notification">
        <div id="notification-icon" class="notification-icon notification-icon--instagram" aria-hidden="true">◎</div>
        <div class="notification-content">
          <div class="notification-meta">
            <b id="notification-app">Instagram</b>
            <time>now</time>
          </div>
          <strong id="notification-sender"></strong>
          <p id="notification-message"></p>
        </div>
      </article>
    </section>

    <aside class="hud" aria-live="polite">
      <div class="title-row">
        <span>Internet Café</span>
        <span id="seat">Seat 1</span>
      </div>
      <div id="connection-status" class="status status--waiting">Connecting…</div>
      <div class="metrics">
        <span>↑ <b id="uplink-fps">0</b> fps</span>
        <span>↓ <b id="downlink-fps">0</b> fps</span>
      </div>
    </aside>

    <section id="start-panel" class="start-panel">
      <p id="camera-message">Allow camera access to join the stream.</p>
      <button id="start-camera" type="button">Start Camera</button>
    </section>

    <!-- The camera is an input only; processed frames are rendered in #output. -->
    <video id="camera" muted playsinline aria-hidden="true"></video>
    <script type="module" src="./phone.js"></script>
  </body>
</html>
